name: Refresh Beautiful Game Analytics

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */8 * * *"
      timezone: "Asia/Manila"

permissions:
  contents: read

concurrency:
  group: beautiful-game-data-pipeline
  cancel-in-progress: false

jobs:
  refresh-data:
    name: Run football data pipeline
    runs-on: ubuntu-latest

    timeout-minutes: 15

    env:
      FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
      FOOTBALL_COMPETITIONS: PD
      FOOTBALL_DATA_BASE_URL: https://api.football-data.org/v4

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify dbt installation
        run: |
          dbt --version

      - name: Run Beautiful Game Analytics pipeline
        run: |
          python -m src.pipeline

      - name: Show generated data
        if: always()
        run: |
          echo "Raw data:"
          find data/raw -maxdepth 5 -type f 2>/dev/null || true

          echo ""
          echo "Processed data:"
          find data/processed -maxdepth 5 -type f 2>/dev/null || true

          echo ""
          echo "Warehouse:"
          ls -lh data/*.duckdb 2>/dev/null || true

      - name: Upload pipeline output for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beautiful-game-pipeline-output
          path: |
            data/raw/
            data/processed/
            data/*.duckdb
          retention-days: 7
          if-no-files-found: warn